services:
  test-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only-password
      MYSQL_DATABASE: training_test
      MYSQL_USER: training
      MYSQL_PASSWORD: test-only-password
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utraining -ptest-only-password --silent"]
      interval: 2s
      timeout: 5s
      retries: 20
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      JWT_SECRET: test-container-secret-at-least-32-characters
      DATABASE_URL: mysql+pymysql://training:test-only-password@test-db:3306/training_test
      TEST_DATABASE_URL: mysql+pymysql://training:test-only-password@test-db:3306/training_test
    depends_on:
      test-db:
        condition: service_healthy
