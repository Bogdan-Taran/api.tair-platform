services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: training_test
      POSTGRES_USER: training
      POSTGRES_PASSWORD: test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      JWT_SECRET: test-container-secret-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://training:test-only-password@test-db:5432/training_test
      TEST_DATABASE_URL: postgresql+psycopg://training:test-only-password@test-db:5432/training_test
    depends_on:
      test-db:
        condition: service_healthy
